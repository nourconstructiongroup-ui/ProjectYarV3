<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>پروژه‌یار</title><style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#24243b;--muted:#77778d;--accent:#7867d9;--line:#e7e4f0;--soft:#eeeafd}body.dark{--bg:#14141d;--card:#232330;--ink:#f4f1ff;--muted:#b4afc5;--accent:#ac9bff;--line:#3b3849;--soft:#302b46}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Tahoma,Arial,sans-serif}header{position:sticky;top:0;background:var(--card);padding:17px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px #0000000b;z-index:2}h1{font-size:20px;margin:0}h2{font-size:18px;margin:8px 0 16px}.shell{padding:18px 14px 95px;max-width:760px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.small{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card);border-radius:17px;padding:18px}.stat b{font-size:26px;display:block;color:var(--accent)}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;font:inherit;cursor:pointer}.ghost{background:var(--soft);color:var(--accent)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav{position:fixed;bottom:0;right:0;left:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:9px 8px;z-index:3;scrollbar-width:none}.nav button{flex:0 0 auto;background:transparent;color:var(--muted);font-size:12px;padding:10px 12px}.nav button.active{background:var(--soft);color:var(--accent)}label{display:block;margin:13px 0 6px;font-size:13px}input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--ink);font:inherit}textarea{min-height:80px;resize:vertical}.modal{position:fixed;inset:0;background:#0008;z-index:5;display:none;align-items:flex-end}.modal.open{display:flex}.panel{width:100%;max-height:91vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:20px}.check{display:flex;align-items:center;gap:8px;margin:9px 0}.check input{width:auto}.itemtitle{font-weight:bold;margin-bottom:7px}.pill{display:inline-block;border-radius:12px;background:var(--soft);color:var(--accent);padding:5px 9px;font-size:12px;margin:4px 0}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:14px}.tile{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:18px 4px;font-size:25px;min-height:88px}.tile span{display:block;font-size:12px;margin-top:7px}.empty{text-align:center;padding:35px;color:var(--muted)}
</style></head><body><header><h1>🌿 پروژه‌یار <span class="small">نسخه ۲ آزمایشی</span></h1><button class="ghost" onclick="toggleTheme()">◐ پوسته</button></header><main class="shell"><div id="content"></div></main><nav class="nav" id="nav"></nav><div class="modal" id="modal"><div class="panel"><div class="actions" style="justify-content:space-between"><h2 id="formTitle"></h2><button class="ghost" onclick="closeModal()">×</button></div><form id="form"></form></div></div><script>
const sections=[['home','خانه'],['projects','پروژه‌ها'],['people','افراد مرتبط'],['contractors','پیمانکاران'],['categories','تخصص‌ها'],['tasks','وظایف'],['purchases','خریدها'],['inventory','انبار'],['finance','مالی پروژه'],['checks','چک‌های من']];
const specs={contractors:{title:'پیمانکار',fields:[['name','نام پیمانکار / شرکت','text',1],['phone','شماره تماس','tel'],['category','حوزه فعالیت','category'],['subcategories','تخصص‌های جزئی','subcategories'],['project','پروژه','project'],['address','نشانی'],['details','توضیحات','textarea']]},projects:{title:'پروژه',fields:[['name','نام پروژه','text',1],['details','توضیحات','textarea']]},people:{title:'فرد مرتبط',fields:[['name','نام فرد','text',1],['phone','موبایل (+۹۸)','tel'],['role','تخصص / سمت'],['details','توضیحات','textarea']]},tasks:{title:'وظیفه',fields:[['name','عنوان وظیفه','text',1],['project','پروژه','project'],['people','مسئولان','people'],['main','مسئول اصلی','person'],['due','مهلت انجام','date'],['priority','اولویت','priority'],['details','توضیحات','textarea']]},purchases:{title:'خرید',fields:[['name','عنوان خرید','text',1],['project','پروژه','project'],['material','جنس / متریال'],['brand','برند'],['spec','مشخصات فنی','textarea'],['buyer','مسئول خرید','person'],['requester','درخواست‌کننده','person'],['qty','تعداد','number'],['price','قیمت واحد (تومان)','number']]},inventory:{title:'گردش انبار',fields:[['name','نام کالا','text',1],['project','پروژه','project'],['type','نوع گردش','movement'],['qty','تعداد','number'],['person','تحویل‌گیرنده','person'],['details','توضیحات','textarea']]},finance:{title:'سند مالی پروژه',fields:[['name','شرح سند','text',1],['project','پروژه','project'],['person','طرف حساب / پیمانکار','person'],['type','نوع سند','financeType'],['amount','مبلغ (تومان)','number'],['date','تاریخ','date'],['details','توضیحات','textarea']]},checks:{title:'چک شخصی',fields:[['name','بابت / طرف حساب','text',1],['number','شماره چک'],['bank','بانک'],['amount','مبلغ (تومان)','number'],['due','تاریخ سررسید','date'],['details','توضیحات','textarea']]}};
let page='home';let data=JSON.parse(localStorage.getItem('py2_data')||'{}');for(const k of Object.keys(specs))data[k]??=[];data.categories??=[{id:'struct',name:'اسکلت و سازه',icon:'🏗️',subs:['آرماتوربندی','قالب‌بندی','بتن‌ریزی','اسکلت فلزی','جوشکاری']},{id:'masonry',name:'سفت‌کاری',icon:'🧱',subs:['دیوارچینی','گچ و خاک','شیب‌بندی','عایق‌کاری']},{id:'finish',name:'نازک‌کاری',icon:'🪚',subs:['کاشی و سرامیک','سنگ‌کاری','نقاشی','کناف','کف‌سازی','درب و پنجره']},{id:'mech',name:'تأسیسات مکانیکی',icon:'⚙️',subs:['کانال‌سازی و تهویه مطبوع','لوله‌کشی آب سرد و گرم','لوله‌کشی فاضلاب','لوله‌کشی گاز','موتورخانه و دیگ‌خانه','سیستم اطفای حریق','چیلر و هواساز','تصفیه‌خانه و استخر']},{id:'elec',name:'تأسیسات برقی',icon:'⚡',subs:['سیم‌کشی','تابلو برق','روشنایی','شبکه و دوربین','اعلام حریق','برق اضطراری','هوشمندسازی']},{id:'land',name:'محوطه‌سازی',icon:'🌳',subs:['فضای سبز','آبیاری','سنگفرش','جدول‌گذاری','دیوار محوطه']},{id:'other',name:'سایر',icon:'📋',subs:[]}];if(localStorage.getItem('py2_dark')==='1')document.body.classList.add('dark');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('py2_data',JSON.stringify(data))}function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('py2_dark',document.body.classList.contains('dark')?'1':'0')}function goto(k){page=k;render()}function render(){document.getElementById('nav').innerHTML=sections.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="goto('${k}')">${t}</button>`).join('');let out='';if(page==='categories'){out='<div class="actions" style="justify-content:space-between"><h2>مدیریت تخصص‌ها</h2><button onclick="editCategory()">+ دسته جدید</button></div>'+data.categories.map((c,i)=>`<div class="card"><div class="itemtitle">${esc(c.icon)} ${esc(c.name)}</div><div class="small">${esc(c.subs.join('، ')||'بدون زیرمجموعه')}</div><div class="actions" style="margin-top:12px"><button class="ghost" onclick="editCategory(${i})">ویرایش دسته و زیرمجموعه‌ها</button><button class="ghost" onclick="deleteCategory(${i})">حذف</button></div></div>`).join('');}else if(page==='home'){out='<h2>داشبورد من</h2><div class="stats">'+[['پروژه‌ها','projects'],['پیمانکاران','contractors'],['وظایف','tasks'],['خریدها','purchases']].map(([t,k])=>`<div class="stat" onclick="goto('${k}')"><b>${data[k].length}</b>${t}</div>`).join('')+'</div><div class="tiles">'+sections.filter(([k])=>k!=='home').map(([k,t])=>`<button class="tile" onclick="goto('${k}')">${({projects:'🏗️',people:'👥',contractors:'👷',categories:'🛠️',tasks:'✅',purchases:'🛒',inventory:'📦',finance:'💰',checks:'📅'})[k]}<span>${t}</span></button>`).join('')+'</div><div class="card" style="margin-top:16px"><b>به پروژه‌یار خوش آمدی</b><p class="small">این نسخه اطلاعات را فعلاً فقط روی همین گوشی نگه می‌دارد. برای پیامک خودکار و کاربران آنلاین به سرور نیاز است.</p></div>'}else{const s=specs[page];out=`<div class="actions" style="justify-content:space-between"><h2>${sections.find(x=>x[0]===page)[1]}</h2><button onclick="openForm('${page}')">+ افزودن</button></div>`;out+=data[page].length?data[page].map((v,i)=>`<div class="card"><div class="itemtitle">${esc(v.name||'بدون عنوان')}</div>${Object.entries(v).filter(([k,val])=>k!=='name'&&val).slice(0,5).map(([k,val])=>`<div class="small">${esc(s.fields.find(f=>f[0]===k)?.[1]||k)}: ${esc(k==='people'?val.split(',').map(id=>data.people.find(p=>p.id===id)?.name||'').join('، '):k==='category'?data.categories.find(c=>c.id===val)?.name||val:k==='subcategories'?val.split('|').join('، '):['person','main','buyer','requester'].includes(k)?data.people.find(p=>p.id===val)?.name||val: k==='project'?data.projects.find(p=>p.id===val)?.name||val:val)}</div>`).join('')}<div class="actions" style="margin-top:12px"><button class="ghost" onclick="openForm('${page}',${i})">ویرایش</button><button class="ghost" onclick="removeItem('${page}',${i})">حذف</button></div></div>`).join(''):'<div class="empty">هنوز موردی ثبت نشده است.</div>'}document.getElementById('content').innerHTML=out}
function fieldHTML(f,val){let [k,label,type='text',required]=f;let id='f_'+k;let attr=required?'required':'';if(type==='textarea')return `<label>${label}</label><textarea id="${id}">${esc(val||'')}</textarea>`;if(type==='category')return `<label>${label}</label><select id="${id}" onchange="updateSubs()"><option value="">انتخاب نشده</option>${data.categories.map(c=>`<option value="${esc(c.id)}" ${val===c.id?'selected':''}>${esc(c.icon+' '+c.name)}</option>`).join('')}</select>`;if(type==='subcategories')return `<label>${label} (انتخاب چند مورد)</label><div id="subChoice"></div><input id="f_subcategories" type="hidden" value="${esc(val||'')}">`;if(type==='people')return `<label>${label} (اختیاری)</label>`+(data.people.length?data.people.map(p=>`<label class="check"><input type="checkbox" name="people" value="${p.id}" ${String(val||'').split(',').includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join(''):'<p class="small">ابتدا در تب افراد مرتبط، فرد جدید ثبت کن.</p>');let options=null;if(type==='project')options=data.projects.map(x=>[x.id,x.name]);if(type==='person')options=data.people.map(x=>[x.id,x.name]);if(type==='priority')options=[['عادی','عادی'],['مهم','مهم'],['فوری','فوری']];if(type==='movement')options=[['ورود','ورود'],['خروج','خروج']];if(type==='financeType')options=[['پرداخت','پرداخت'],['دریافت','دریافت'],['هزینه','هزینه'],['قرارداد','قرارداد']];if(options)return `<label>${label}</label><select id="${id}"><option value="">انتخاب نشده</option>${options.map(([v,t])=>`<option value="${esc(v)}" ${val===v?'selected':''}>${esc(t)}</option>`).join('')}</select>`;return `<label>${label}${required?' *':''}</label><input id="${id}" type="${type}" ${attr} value="${esc(val||'')}">`}
let editKey='',editIndex=-1;function openForm(k,i=-1){editKey=k;editIndex=i;let v=i>=0?data[k][i]:{};document.getElementById('formTitle').textContent=(i>=0?'ویرایش ':'ثبت ')+specs[k].title;document.getElementById('form').innerHTML=specs[k].fields.map(f=>fieldHTML(f,v[f[0]])).join('')+'<div style="height:18px"></div><button type="submit" style="width:100%">ذخیره</button>';document.getElementById('modal').classList.add('open');if(k==='contractors')updateSubs();document.getElementById('form').onsubmit=e=>{e.preventDefault();const obj={id:v.id||String(Date.now())};for(const [key,,type]of specs[k].fields){obj[key]=type==='subcategories'?[...document.querySelectorAll('input[name=subcat]:checked')].map(x=>x.value).join('|'):type==='people'?[...document.querySelectorAll('input[name=people]:checked')].map(x=>x.value).join(','):document.getElementById('f_'+key).value.trim()}if(i>=0)data[k][i]=obj;else data[k].push(obj);save();closeModal();render()}}
function updateSubs(){const c=data.categories.find(c=>c.id===document.getElementById('f_category')?.value);const selected=(document.getElementById('f_subcategories')?.value||'').split('|');document.getElementById('subChoice').innerHTML=c?(c.subs.map(sub=>`<label class="check"><input type="checkbox" name="subcat" value="${esc(sub)}" ${selected.includes(sub)?'checked':''}>${esc(sub)}</label>`).join('')||'<p class="small">زیرمجموعه‌ای تعریف نشده است.</p>'):'<p class="small">ابتدا حوزه فعالیت را انتخاب کنید.</p>';}function closeModal(){document.getElementById('modal').classList.remove('open')}function editCategory(i=-1){const old=i>=0?data.categories[i]:{name:'',icon:'🛠️',subs:[]};const name=prompt('نام دسته فعالیت',old.name);if(name===null||!name.trim())return;const icon=prompt('نماد یا ایموجی دسته',old.icon);if(icon===null)return;const subs=prompt('زیرمجموعه‌ها را با ویرگول جدا کنید (قابل ویرایش)',old.subs.join('، '));if(subs===null)return;const obj={id:old.id||'cat_'+Date.now(),name:name.trim(),icon:icon.trim()||'🛠️',subs:[...new Set(subs.split(/[,،\n]+/).map(x=>x.trim()).filter(Boolean))]};if(i>=0)data.categories[i]=obj;else data.categories.push(obj);save();render()}function deleteCategory(i){if(data.contractors.some(c=>c.category===data.categories[i].id)){alert('این دسته برای پیمانکار استفاده شده و قابل حذف نیست.');return}if(confirm('دسته و زیرمجموعه‌هایش حذف شود؟')){data.categories.splice(i,1);save();render()}}function removeItem(k,i){if(confirm('این مورد حذف شود؟')){data[k].splice(i,1);save();render()}}render();
</script></body></html>
